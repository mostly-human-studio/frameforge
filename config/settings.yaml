# FrameForge workspace settings. Secrets never go here; use environment variables.
default_profile: technical-dark
default_duration_s: 60
default_aspect: "16:9"
fps: 30
scene_padding_s: 0.4
duration_tolerance: 0.10
narration_wpm: 150      # used to estimate duration before audio exists
director: stub          # stub (offline) | external (Claude Code writes the files)
telemetry: false
